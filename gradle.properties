org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9, 'com.android.application' ile 'kotlin.multiplatform' eklentisinin ayni modulde
# kullanilmasini engelliyor. Resmi cozum projeyi ikiye bolmek (KMP kutuphane modulu +
# ayri Android uygulama modulu), ama Compose Multiplatform 1.11.1 henuz tek modullu
# yapiyi varsayiyor. Bu iki bayrak AGP'nin kendi onerdigi gecis yolu.
# Yeniden degerlendir: CMP, AGP 9 modul ayrimini resmen destekledigi surumde kaldir.
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
