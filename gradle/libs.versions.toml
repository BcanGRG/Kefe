[versions]
# Not: Compose Multiplatform kendi surum hizalamasini org.jetbrains.compose eklentisi
# uzerinden yapar. androidx compose-bom EKLENMEZ - CMP'nin Android tarafi zaten
# androidx.compose.* artifact'lerine cozuluyor ve BOM onlarin surumunu ezerek
# CMP'nin bekledigi surumden kaydirir.
agp = "9.3.1"
kotlin = "2.4.10"
composeMultiplatform = "1.11.1"
coreSplashscreen = "1.2.0"
androidxBiometric = "1.1.0"
coroutines = "1.11.0"
lifecycle = "2.11.0"
navigation3 = "1.1.1"
activityCompose = "1.13.0"
ktor = "3.5.1"
koin = "4.2.2"
serialization = "1.11.0"
# 2.2.0, 2.3.0 ve 2.3.1 eksik artifact'la yayinlandi; bakim ekibi bu ucunu de
# "kirik yayin" olarak isaretledi. 2.3.2 hem bunlarin duzeltmesi hem de AGP 9'un
# yeni DSL'i ve AGP'nin gomulu Kotlin'i ile uyumu getiren ilk surum - bu proje
# AGP 9.3.1 uzerinde durdugu icin daha eskisi secilemez.
sqldelight = "2.3.2"

# lifecycle 2.11.0 compileSdk 37+ istiyor.
androidCompileSdk = "37"
androidMinSdk = "26"
androidTargetSdk = "37"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
# Ortak koddan sistem geri tusunu yakalamak icin. navigation3 bunu zaten gecisli
# getiriyor ama YALNIZ calisma zamaninda; derlemede gorunmesi icin acikca yazilir.
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }

androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidxBiometric" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
# Flow donduren okuma sozlesmesi (asFlow().mapToList) bu artifact'tan geliyor.
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
# Masaustu surucusu "sqlite-driver" adiyla yayinlaniyor; "jvm-driver" diye bir artifact yok.
sqldelight-driver-jvm = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-driver-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
