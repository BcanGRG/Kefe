[versions]
# Not: Compose Multiplatform kendi surum hizalamasini org.jetbrains.compose eklentisi
# uzerinden yapar. androidx compose-bom EKLENMEZ - CMP'nin Android tarafi zaten
# androidx.compose.* artifact'lerine cozuluyor ve BOM onlarin surumunu ezerek
# CMP'nin bekledigi surumden kaydirir.
agp = "9.4.1"
kotlin = "2.4.20"
composeMultiplatform = "1.12.1"
# Material3 CMP'den AYRI surumlenir. 1.9.0 kararli (Jetpack Material3 1.4);
# CMP 1.12'nin kendi esledigi 1.12.0-alpha03 alfa. Eski `compose.material3`
# erisimcisi de 1.9.0'a cozuluyordu - gecis davranisi degistirmez.
composeMaterial3 = "1.9.0"
coreSplashscreen = "1.2.0"
androidxBiometric = "1.1.0"
coroutines = "1.11.0"
lifecycle = "2.11.0"
navigation3 = "1.1.2"
# navigation3 1.1.2'nin (ve CMP 1.12.1'in) gecisli olarak istedigi surum; ayrisirsa NavDisplay ile
# ayni gonderici ustunde bulusmayan iki kopya olusabilir.
navigationevent = "1.1.0"
activityCompose = "1.13.0"
# MainActivity bir FragmentActivity. biometric 1.1.0 gecisli olarak fragment 1.2.5
# getiriyor; registerForActivityResult 1.3.0+ ister (lint: InvalidFragmentVersion-
# ForActivityResult). Calisma zamaninda diger kutuphaneler yuzunden zaten 1.8.9'a
# cozuluyordu - androidApp'in derleme yolu da ayni surumu gorsun diye acikca yazilir.
fragment = "1.8.9"
ktor = "3.6.0"
koin = "4.2.2"
serialization = "1.11.0"
# 2.2.0, 2.3.0 ve 2.3.1 eksik artifact'la yayinlandi; bakim ekibi bu ucunu de
# "kirik yayin" olarak isaretledi. 2.3.2 hem bunlarin duzeltmesi hem de AGP 9'un
# yeni DSL'i ve AGP'nin gomulu Kotlin'i ile uyumu getiren ilk surum - bu proje
# AGP 9.3.1 uzerinde durdugu icin daha eskisi secilemez.
sqldelight = "2.4.0"

# lifecycle 2.11.0 compileSdk 37+ istiyor.
androidCompileSdk = "37"
androidMinSdk = "26"
androidTargetSdk = "37"

# Uygulama surumu TEK YERDE. Android paketi (androidApp: versionName/versionCode)
# ve uretilen SupabaseConfig.AppVersion (composeApp, Ayarlar'daki "Kefe 1.0.0")
# ikisi de buradan okur; iki modulde ayri yazilirsa yine birbirinden kayar.
appVersionName = "1.0.0"
appVersionCode = "1"

[libraries]
# Compose Multiplatform. `compose.runtime` / `compose.material3` gibi Gradle
# erisimcileri CMP 1.12'de kullanimdan kalkti ("Specify dependency directly");
# surumleri artik burada, digerleri gibi.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
# Ortak koddan "uygulama on planda mi" sinyali (LifecycleResumeEffect) icin.
# viewmodel-compose bunu gecisli getiriyor ama derlemede gorunmesi icin acikca yazilir.
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
# Ortak koddan sistem geri tusunu yakalamak icin. navigation3 bunu zaten gecisli
# getiriyor ama YALNIZ calisma zamaninda; derlemede gorunmesi icin acikca yazilir.
# Compose'un ui-backhandler'i kullanimdan kaldirildi; NavDisplay'in kendi geri
# isleyicisi de bu artifact'tan geliyor - ayni gonderici, ayni oncelik sirasi.
# Surum navigation3'un istedigiyle ayni tutulur (1.1.2 -> 1.1.0).
navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "navigationevent" }

androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidxBiometric" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
# Supabase Realtime (Phoenix) soketi icin. Motor basina ayri artifact yok:
# okhttp/cio/darwin kendi WS destegini getirir.
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
# Flow donduren okuma sozlesmesi (asFlow().mapToList) bu artifact'tan geliyor.
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
# Masaustu surucusu "sqlite-driver" adiyla yayinlaniyor; "jvm-driver" diye bir artifact yok.
sqldelight-driver-jvm = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-driver-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
# composeApp'in Android hedefi. AGP 9'dan beri KMP eklentisi com.android.application
# ile ayni modulde kullanilamiyor; uygulama androidApp'te, ortak kod composeApp'te.
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
